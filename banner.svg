<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Kabir Anand: AI automation and operations builder">
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.dash{stroke-dasharray:8 8;animation:f 1s linear infinite}
@keyframes f{to{stroke-dashoffset:-16}}
.p{animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
.pk{offset-rotate:0deg}
</style>
<rect width="900" height="260" rx="16" fill="#101c2b"/>
<g stroke="#1d2e45" stroke-width="1">
<path d="M0 52H900M0 104H900M0 156H900M0 208H900M60 0V260M120 0V260M180 0V260M240 0V260M300 0V260M360 0V260M420 0V260M480 0V260M540 0V260M600 0V260M660 0V260M720 0V260M780 0V260M840 0V260"/>
</g>
<text class="t" x="48" y="96" font-size="52" font-weight="800" fill="#eef1f4">Kabir Anand</text>
<text class="t" x="48" y="136" font-size="22" fill="#b9c6d6">I build AI automations for sales, operations and finance.</text>
<text class="t" x="48" y="172" font-size="16" fill="#8fa2b8">Make.com  |  Claude  |  GPT-4o  |  Python  |  WhatsApp and Slack APIs</text>
<g transform="translate(0,205)">
<rect x="48" y="-18" width="110" height="36" rx="9" fill="#101c2b" stroke="#eef1f4" stroke-width="2"/>
<text class="t" x="103" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#eef1f4">New lead</text>
<path d="M158 0H262" stroke="#eef1f4" stroke-width="2.5" class="dash"/>
<rect x="262" y="-18" width="130" height="36" rx="9" fill="#101c2b" stroke="#eef1f4" stroke-width="2"/>
<text class="t" x="327" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#eef1f4">AI scores it</text>
<path d="M392 0H496" stroke="#eef1f4" stroke-width="2.5" class="dash"/>
<rect x="496" y="-18" width="130" height="36" rx="9" fill="#f26a21"/>
<text class="t" x="561" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Visit booked</text>
<circle r="7" fill="#f6b73c">
<animateMotion dur="3.6s" repeatCount="indefinite" path="M103 0 L327 0 L561 0"/>
</circle>
</g>
<g class="p"><circle cx="780" cy="120" r="54" fill="none" stroke="#f26a21" stroke-width="3"/><circle cx="780" cy="120" r="18" fill="#f26a21"/></g>
<circle cx="780" cy="120" r="18" fill="none" stroke="#f26a21" stroke-width="2">
<animate attributeName="r" from="18" to="62" dur="2.4s" repeatCount="indefinite"/>
<animate attributeName="opacity" from="0.8" to="0" dur="2.4s" repeatCount="indefinite"/>
</circle>
</svg>
